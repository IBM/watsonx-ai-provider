name: Release

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm.
# The workflow filename must stay `release.yml` — npm's Trusted Publisher
# config is bound to it.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

defaults:
  run:
    working-directory: package

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Checks out the commit the release tag points at.
      - uses: actions/checkout@v5

      # Trusted Publishing requires npm >= 11.5.1, which Node 24.5+ bundles.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package/package-lock.json

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'. Bump package.json (or fix the tag) and re-create the release as v$VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Releases marked "pre-release" in GitHub publish under the `next` dist-tag
      # so `npm install watsonx-ai-provider` keeps resolving to the latest stable.
      - name: Publish to npm (Trusted Publishing / OIDC)
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
